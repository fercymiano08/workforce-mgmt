# Docker Compose stack: PostgreSQL + the one Laravel backend + its scheduler + the frontend.
# Start:  docker compose up -d --build        Stop:  docker compose down        (data survives; add -v to erase it)
# Secrets come from the git-ignored ".env" next to this file (template: .env.docker.example).
name: workforce

x-backend: &backend
  restart: unless-stopped
  environment: &backend-env
    APP_NAME: 'WorkForce Pro'
    APP_ENV: production
    APP_DEBUG: "false"
    APP_URL: 'http://localhost:8000'
    APP_KEY: ${APP_KEY}
    LOG_CHANNEL: stderr
    LOG_LEVEL: warning
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: 'workforce_mgnt'
    DB_USERNAME: postgres
    DB_PASSWORD: ${POSTGRES_PASSWORD}
    SESSION_DRIVER: database
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    BCRYPT_ROUNDS: "12"
    PORT: '8000'
    FRONTEND_URL: http://localhost:5173
    SEED_DEMO_DATA: 'false'
    GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
    GEMINI_MODEL: 'gemini-3.1-flash-lite'
    GEMINI_TIMEOUT: '15'
    MAIL_MAILER: "${MAIL_MAILER:-log}"
    MAIL_HOST: "${MAIL_HOST:-}"
    MAIL_PORT: "${MAIL_PORT:-587}"
    MAIL_USERNAME: "${MAIL_USERNAME:-}"
    MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    MAIL_FROM_ADDRESS: 'no-reply@workforcepro.com'
    MAIL_FROM_NAME: 'WorkForce Pro'

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workforce_mgnt
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "5433:5432"   # optional: inspect from the host (5433 so it never clashes with a local PostgreSQL)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d workforce_mgnt"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    <<: *backend
    image: workforce/app
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        SERVICE: app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      <<: *backend-env
      RUN_MIGRATIONS: 'true'
      RUN_SEED: 'true'
    healthcheck:
      test: ["CMD", "php", "-r", "$$r = @file_get_contents('http://127.0.0.1:8000/up'); exit($$r !== false && strpos($$r, 'Fatal error') === false ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  scheduler:
    <<: *backend
    image: workforce/app
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      <<: *backend-env

  frontend:
    image: workforce/frontend
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
