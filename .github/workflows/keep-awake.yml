# Render's free web services sleep after 15 minutes without a request, and a sleeping service
# needs ~30-60 seconds to boot before it answers - longer than the 45s the app's HTTP client waits.
# This ping hits the health endpoint every 5 minutes, so the demo is always warm.
# GitHub's shortest allowed schedule is every 5 minutes.
name: Keep the demo API awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API health endpoint
        # continue-on-error: a cold start or a deploy in progress shows a red X on a run that did
        # not actually fail. The next ping is 5 minutes away either way.
        continue-on-error: true
        run: curl -sSf --max-time 180 https://workforce-api-nm7v.onrender.com/up && echo "API is awake."
