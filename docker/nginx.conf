# nginx for the frontend container: serves the built React app and proxies /api/* to the backend.
# Same target as the dev proxy in frontend/vite.config.js.
# "app" is the Docker Compose service name; the resolver looks it up on every request, so a
# restarted container is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;   # face photos (base64) and leave proof uploads

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;     # AI Decision Support can take a while

    location /api { set $up http://app:8000; proxy_pass $up; }

    # React single-page app: unknown paths fall back to index.html so client-side routes work.
    location / { try_files $uri /index.html; }
}
