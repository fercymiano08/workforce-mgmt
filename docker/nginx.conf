# nginx for the frontend container: serves the built React app and routes /api/* to the
# microservice that owns each prefix. Same table as the dev proxy in frontend/vite.config.js.
# Hostnames (core, attendance...) are Docker Compose service names; the resolver makes nginx
# look them up on every request, so a restarted container is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;   # face photos (base64) and leave proof uploads

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;     # AI Decision Support can take a while

    location /api/analytics { set $up http://intelligence:8001; proxy_pass $up; }
    location /api/attendance { set $up http://attendance:8003; proxy_pass $up; }
    location /api/kiosk { set $up http://attendance:8003; proxy_pass $up; }
    location /api/shifts { set $up http://scheduling:8004; proxy_pass $up; }
    location /api/leaves { set $up http://timeoff:8005; proxy_pass $up; }
    location /api/overtime { set $up http://timeoff:8005; proxy_pass $up; }
    location /api/timesheets { set $up http://payroll:8006; proxy_pass $up; }
    location /api/notifications { set $up http://communications:8007; proxy_pass $up; }
    location /api/settings { set $up http://configuration:8008; proxy_pass $up; }

    # Everything else under /api (auth, employees, departments, roles, profile, audit...) -> core.
    location /api { set $up http://core:8000; proxy_pass $up; }

    # React single-page app: unknown paths fall back to index.html so client-side routes work.
    location / { try_files $uri /index.html; }
}
