# nginx for the frontend container: serves the built React app and proxies /api/* to the backend.
# Same target as the dev proxy in frontend/vite.config.js.
# "app" is the Docker Compose service name; the resolver looks it up on every request, so a
# restarted container is picked up without restarting nginx.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;   # face photos (base64) and leave proof uploads

    # Compression. Nothing was compressed before, so the kiosk's ~350 kB app shell and ~630 kB face
    # bundle crossed the network at full size on every cold load. The model weights are binary and
    # barely compress, but everything the browser parses does.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;     # AI Decision Support can take a while

    location /api { set $up http://app:8000; proxy_pass $up; }

    # The page shell and the build stamp must never be cached: after an update, a reload has to fetch the
    # new index.html (which points at the new, differently named JS/CSS files) and the new version.json.
    location = /index.html   { add_header Cache-Control "no-cache, no-store, must-revalidate"; }
    location = /version.json { add_header Cache-Control "no-cache, no-store, must-revalidate"; }

    # Built JS/CSS files have a content hash in their name, so they can be cached for good.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    # The face-recognition weights (~6.7 MB) never change at runtime. They used to fall through to
    # the "no-cache, no-store" rule below, so every reload, reboot and midnight relock re-downloaded
    # all of it before the kiosk could scan again. Cached for 30 days; bump the folder name (or add
    # a query string in MODEL_URL) if the model files are ever replaced.
    location /models/ { add_header Cache-Control "public, max-age=2592000"; }

    # React single-page app: unknown paths fall back to index.html so client-side routes work.
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri /index.html;
    }
}
