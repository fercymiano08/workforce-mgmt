# Render Blueprint - the whole public demo in one file.
#   Render dashboard -> New -> Blueprint -> connect this GitHub repo -> Apply.
# Render then builds the API from docker/backend.Dockerfile, builds the React app and creates the
# Postgres database. Three values still have to be typed into the dashboard by hand - see below.
#
# !!! The free Postgres is DELETED 30 days after it is created. See DEPLOY.md ("Before the 30 days
# run out") - it is a 10 minute move to a free Neon database that never expires.

databases:
  - name: workforce-db
    plan: free
    databaseName: workforce_mgnt
    # Render reserves the name "postgres" for its own superuser, so this has to be something else.
    # The API does not care: it is handed a single DB_URL (see the note below).
    user: workforce
    # Any supported version works: the migrations use plain schema builder calls, nothing that
    # needs 17 or 18. Bump this if your panel offers a newer one.
    postgresMajorVersion: "16"

# Three values cannot live in this file and are typed into the Render dashboard by hand, on
# workforce-api -> Environment (Render keeps any variable that is not declared here):
#   APP_KEY          php artisan key:generate --show   (the whole base64:... line)
#   DB_URL           workforce-db -> "Internal Database URL" on its dashboard
#   GEMINI_API_KEY   optional, from https://aistudio.google.com - blank falls back to rule-based AI
# This is deliberate: fromDatabase/envVarGroup bindings were silently dropped when this Blueprint
# was first applied, which left the API running with no database and no migrations.
#
# Hostnames below are the real ones Render assigned. If a service ever gets a new suffix, change it
# in APP_URL, FRONTEND_URL and VITE_API_URL, plus the ping in .github/workflows/keep-awake.yml.

services:
  # ---------------------------------------------------------------- API (Laravel 13 / PHP 8.4)
  - type: web
    name: workforce-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./docker/backend.Dockerfile
    healthCheckPath: /up
    # The scheduler (routes/console.php) runs in this same container, in the background, instead of
    # as a separate Render cron job: Render charges a minimum of $1/month per cron job, and one
    # instance only ever runs one scheduler anyway. It has to be a script inside the image - Render
    # hands dockerCommand straight to the container without parsing quotes, so an inline
    # sh -c "... & ... && ..." arrives as one (nonexistent) command name and the deploy dies 127.
    dockerCommand: /usr/local/bin/backend-start
    envVars:
      - key: APP_NAME
        value: WorkForce Pro
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://workforce-api-nm7v.onrender.com
      # Used for the link inside the "reset your password" email only.
      - key: FRONTEND_URL
        value: https://workforce-frontend.onrender.com
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      # docker/backend-entrypoint.sh: migrate on boot, then seed (both are idempotent).
      - key: RUN_MIGRATIONS
        value: "true"
      - key: RUN_SEED
        value: "true"
      # The rich demo dataset - employees, schedules, attendance, timesheets. Set to "false" to keep
      # only the admin account and the department/role structure.
      - key: SEED_DEMO_DATA
        value: "true"
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_TIMEOUT
        value: "15"
      # "log" writes emails to the service log instead of sending them (Dashboard -> Logs). Swap for
      # a real mailer later, see DEPLOY.md ("Sending real emails").
      - key: MAIL_MAILER
        value: log
      - key: MAIL_FROM_ADDRESS
        value: no-reply@workforcepro.com
      - key: MAIL_FROM_NAME
        value: WorkForce Pro
      - key: DB_CONNECTION
        value: pgsql
      # DB_URL is set by hand on the service's Environment tab (see the note at the top of this
      # file). It is the "Internal Database URL" from the workforce-db page, and Laravel's pgsql
      # config reads it directly, so it replaces DB_HOST/DB_PORT/DB_DATABASE/DB_USERNAME/DB_PASSWORD.

  # ------------------------------------------------------- Frontend (React 19 / Vite, static files)
  - type: web
    name: workforce-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    # React Router: a deep link such as /attendance must serve index.html, not 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Vite 8 needs Node 20.19+ / 22.12+, and Render would otherwise pick its own default.
      - key: NODE_VERSION
        value: "22"
      # Read at BUILD time by frontend/src/services/http.js, so changing it needs a redeploy.
      - key: VITE_API_URL
        value: https://workforce-api-nm7v.onrender.com
